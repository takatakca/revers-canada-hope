name: Deploy REVERS CANADA to MochaHost

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["REVERS CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: revers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Only release an actual successful push to our own main, or an authorized manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate deployment configuration
        env:
          MOCHAHOST_HOST: ${{ secrets.MOCHAHOST_HOST }}
          MOCHAHOST_USER: ${{ secrets.MOCHAHOST_USER }}
          MOCHAHOST_SSH_PORT: ${{ secrets.MOCHAHOST_SSH_PORT }}
          MOCHAHOST_APP_ROOT: ${{ secrets.MOCHAHOST_APP_ROOT }}
          MOCHAHOST_SSH_PRIVATE_KEY: ${{ secrets.MOCHAHOST_SSH_PRIVATE_KEY }}
          MOCHAHOST_KNOWN_HOSTS: ${{ secrets.MOCHAHOST_KNOWN_HOSTS }}
          REVERS_PRODUCTION_URL: ${{ secrets.REVERS_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for name in MOCHAHOST_HOST MOCHAHOST_USER MOCHAHOST_SSH_PORT MOCHAHOST_APP_ROOT MOCHAHOST_SSH_PRIVATE_KEY MOCHAHOST_KNOWN_HOSTS REVERS_PRODUCTION_URL; do
            test -n "${!name}" || { echo "Missing required deployment secret: $name"; exit 1; }
          done
          # Fail closed on unexpected paths/URLs before any remote shell or deletion.
          [[ "$MOCHAHOST_APP_ROOT" =~ ^/home/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid application root"; exit 1; }
          [[ "$MOCHAHOST_APP_ROOT" != *..* && "$MOCHAHOST_APP_ROOT" != */ ]] || { echo "Unsafe application root"; exit 1; }
          [[ "$MOCHAHOST_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid SSH port"; exit 1; }
          [[ "$REVERS_PRODUCTION_URL" == https://reverscanada.ca ]] || { echo "Expected canonical production URL https://reverscanada.ca"; exit 1; }

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gates
        run: |
          npm run qa:github-migration
          npm run typecheck
          npm run lint
          npm run test
          NITRO_PRESET=node-server npm run build

      - name: Verify build artifact
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          test -f app.js

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MOCHAHOST_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.MOCHAHOST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/revers_deploy_key
          chmod 600 ~/.ssh/revers_deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package immutable release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf artifact release.tgz
          mkdir -p artifact
          cp -a .output artifact/.output
          printf '%s\n' "$RELEASE_SHA" > artifact/RELEASE_SHA
          tar -czf release.tgz -C artifact .

      - name: Upload release
        env:
          HOST: ${{ secrets.MOCHAHOST_HOST }}
          USER: ${{ secrets.MOCHAHOST_USER }}
          PORT: ${{ secrets.MOCHAHOST_SSH_PORT }}
          ROOT: ${{ secrets.MOCHAHOST_APP_ROOT }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/revers_deploy_key -p "$PORT" "$USER@$HOST" "mkdir -p '$ROOT/incoming' '$ROOT/releases/$RELEASE_SHA' '$ROOT/tmp'"
          scp -i ~/.ssh/revers_deploy_key -P "$PORT" release.tgz "$USER@$HOST:$ROOT/incoming/$RELEASE_SHA.tgz"
          scp -i ~/.ssh/revers_deploy_key -P "$PORT" app.js "$USER@$HOST:$ROOT/app.js"

      - name: Activate release
        env:
          HOST: ${{ secrets.MOCHAHOST_HOST }}
          USER: ${{ secrets.MOCHAHOST_USER }}
          PORT: ${{ secrets.MOCHAHOST_SSH_PORT }}
          ROOT: ${{ secrets.MOCHAHOST_APP_ROOT }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/revers_deploy_key -p "$PORT" "$USER@$HOST" "ROOT='$ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$ROOT/releases/$RELEASE_SHA" "$ROOT/tmp"
          tar -xzf "$ROOT/incoming/$RELEASE_SHA.tgz" -C "$ROOT/releases/$RELEASE_SHA"
          test -f "$ROOT/releases/$RELEASE_SHA/.output/server/index.mjs"
          printf '%s\n' "$RELEASE_SHA" > "$ROOT/releases/$RELEASE_SHA/RELEASE_SHA"

          if [ -f "$ROOT/CURRENT" ]; then
            cp "$ROOT/CURRENT" "$ROOT/PREVIOUS"
          fi

          printf '%s\n' "$RELEASE_SHA" > "$ROOT/CURRENT.next"
          mv -f "$ROOT/CURRENT.next" "$ROOT/CURRENT"
          touch "$ROOT/tmp/restart.txt"
          rm -f "$ROOT/incoming/$RELEASE_SHA.tgz"
          REMOTE

      - name: Verify production health
        env:
          HOST: ${{ secrets.MOCHAHOST_HOST }}
          USER: ${{ secrets.MOCHAHOST_USER }}
          PORT: ${{ secrets.MOCHAHOST_SSH_PORT }}
          ROOT: ${{ secrets.MOCHAHOST_APP_ROOT }}
          REVERS_PRODUCTION_URL: ${{ secrets.REVERS_PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "$REVERS_PRODUCTION_URL/healthz" | jq -e --arg sha "$EXPECTED_SHA" '.ok == true and .release == $sha' >/dev/null &&
               curl -fsS --max-time 15 "$REVERS_PRODUCTION_URL/readyz" | jq -e '.ok == true' >/dev/null; then
              health_ok=true
              break
            fi
            sleep 5
          done

          if [ "$health_ok" != true ]; then
            echo "Production health check failed; rolling back."
            ssh -i ~/.ssh/revers_deploy_key -p "$PORT" "$USER@$HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -s "$ROOT/PREVIOUS" ]; then
            cp "$ROOT/PREVIOUS" "$ROOT/CURRENT"
          else
            rm -f "$ROOT/CURRENT"
          fi
          touch "$ROOT/tmp/restart.txt"
          REMOTE
            exit 1
          fi

      - name: Keep latest five releases
        env:
          HOST: ${{ secrets.MOCHAHOST_HOST }}
          USER: ${{ secrets.MOCHAHOST_USER }}
          PORT: ${{ secrets.MOCHAHOST_SSH_PORT }}
          ROOT: ${{ secrets.MOCHAHOST_APP_ROOT }}
        run: |
          ssh -i ~/.ssh/revers_deploy_key -p "$PORT" "$USER@$HOST" "ROOT='$ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$(cat "$ROOT/CURRENT" 2>/dev/null || true)"
          previous="$(cat "$ROOT/PREVIOUS" 2>/dev/null || true)"
          kept=0
          # Retain the current/rollback pointers unconditionally, plus five other releases.
          while IFS= read -r release; do
            [ -n "$release" ] || continue
            name="${release##*/}"
            if [ "$name" = "$current" ] || [ "$name" = "$previous" ]; then
              continue
            fi
            kept=$((kept + 1))
            if [ "$kept" -gt 5 ]; then
              rm -rf -- "$release"
            fi
          done < <(
            find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' |
              sort -nr |
              cut -d' ' -f2-
          )
          REMOTE
