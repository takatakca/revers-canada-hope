name: Repair REVERS npm lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

concurrency:
  group: revers-lockfile-maintenance
  cancel-in-progress: false

jobs:
  synchronize-lockfile:
    if: github.repository == 'takatakca/revers-canada-hope'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main with no destructive reset
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22 with npm 10
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify reproducible dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm lockfile integrity
        run: |
          set -euo pipefail
          git diff --check
          test -s package-lock.json
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(l.name!==p.name || l.lockfileVersion<2) process.exit(1)'

      - name: Commit synchronized lockfile only if main is unchanged
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(revers): synchronize npm lockfile for Node 22"
          # Reject concurrent edits by other agents rather than force-pushing.
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced; refuse to overwrite another agent's commit."
            exit 1
          fi
          git push origin HEAD:main
